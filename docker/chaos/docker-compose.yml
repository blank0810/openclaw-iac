# Chaos — single OpenClaw 4.14 container, gateway-only access.
#
# Rendered/uploaded by infra/tasks/chaos_deploy.py to /opt/openclaw/chaos/.
# All secrets (tokens, URLs) come from the sibling remote .env file
# (mode 0600, owned by overlord101) — NEVER hardcode them here.
#
# Scaffolding:
#   - chaos_net: second service can join later with one line.
#   - ./workspace: RW mount, empty on day one (fs tools are denied in openclaw.json).
#   - state/, workspace/ created by the deploy task.

services:
  chaos:
    image: ${CHAOS_IMAGE}
    container_name: chaos
    init: true
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
    ports:
      # Gateway — bind to host loopback only. Access via SSH tunnel:
      #   ssh -L 18789:127.0.0.1:18789 -p 2222 overlord101@<SERVER3_IP>
      - "127.0.0.1:18789:18789"
    volumes:
      - ./state:/home/node/.openclaw
      - ./workspace:/home/node/.openclaw/workspace
      - ./config/openclaw.json:/home/node/.openclaw/openclaw.json:ro
    networks: [chaos_net]
    cap_drop: [ALL]
    # NOTE: do NOT add `seccomp=default` here — Docker parses that as a file
    # path and breaks compose up (see commit f827193). Default seccomp is
    # applied implicitly.
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:size=100m,mode=1777
      - /home/node/.cache:size=100m,mode=0755,uid=1000,gid=1000
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18789/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 240s

networks:
  chaos_net:
    driver: bridge
