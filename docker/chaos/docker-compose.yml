# Env var convention: openclaw.json uses ${CHAOS_*} tokens directly — we do NOT
# rename vars in the compose environment block. All CHAOS_* vars come in via
# env_file: .env and are visible to the container as-is. This keeps one naming
# convention everywhere: .env file, compose, openclaw.json substitutions.

services:
  chaos:
    image: ${CHAOS_IMAGE}
    container_name: chaos
    init: true
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - ./state:/home/node/.openclaw
      # Workspace mounted read-write so Chaos can author its own identity,
      # skills, and models via the fs tool group. Nightly backup in
      # chaos_backup.py protects against bad self-edits.
      - ./workspace:/home/node/.openclaw/workspace
    networks: [chaos_net]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp profile is applied automatically when no
      # `seccomp=<path>` is specified. Explicit `seccomp=default` is NOT a
      # valid value — Docker parses it as a relative file path and fails
      # with "no such file or directory".
    read_only: true
    tmpfs:
      - /tmp:size=100m,mode=1777
      - /home/node/.cache:size=100m,mode=0755,uid=1000,gid=1000
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18789/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 240s
    depends_on:
      searxng:
        condition: service_healthy

  # SearXNG intentionally is NOT read_only and retains CHOWN/SETGID/SETUID caps.
  # Its entrypoint drops privs from root to uid 977 and regenerates settings
  # into /etc/searxng/ at startup. Adding read_only or stripping those caps
  # crashes the container. This is known and deliberate.
  searxng:
    image: ${SEARXNG_IMAGE}
    container_name: chaos_searxng
    restart: unless-stopped
    env_file: .env
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY}
      INSTANCE_NAME: chaos-searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    networks: [chaos_net]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    # SearXNG has no /healthz endpoint — probe the root page instead.
    # A 200 on / confirms the search UI is being served.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  chaos_net:
    driver: bridge
    name: chaos_net
