services:
  zeroclaw:
    # Pinned to the upstream version we vetted locally (apps/zeroclaw/upstream).
    # Debian variant ships with bash + curl so `docker compose exec` and
    # exec-based healthchecks behave predictably; distroless exits immediately
    # on some hosts.
    image: ${ZEROCLAW_IMAGE}
    container_name: zeroclaw
    restart: unless-stopped

    environment:
      TZ: ${TZ:-UTC}
      # Required by the gateway when binding inside a container.
      ZEROCLAW_ALLOW_PUBLIC_BIND: "true"
      ZEROCLAW_GATEWAY_PORT: "42617"

    volumes:
      # Persistent data: ZeroClaw stores its config + workspace + sqlite under
      # /zeroclaw-data. Bind-mount to a host path owned by overlord101 so
      # backups + permissions are predictable (matches the chaos pattern).
      - /opt/zeroclaw/data:/zeroclaw-data
      # Templated config rendered by infra/tasks/zeroclaw_deploy.py.
      # Read-only mount — the daemon must not rewrite our IaC source of truth.
      - /opt/zeroclaw/config/config.toml:/zeroclaw-data/.zeroclaw/config.toml:ro

    # Bridge networking is sufficient: the LiteLLM proxy lives on the host's
    # private NIC (10.0.0.4:4000) and Docker bridges out via the host route.
    # Gateway port stays bound to localhost only — UFW already denies inbound,
    # but defence-in-depth: do not expose 42617 publicly.
    ports:
      - "127.0.0.1:42617:42617"

    # Container hardening — rationale per .claude/agents/zeroclaw-engineer.md
    # and OWASP Docker Security Cheat Sheet. ZeroClaw needs zero kernel caps;
    # all writeable state is scoped to the bind-mounted /zeroclaw-data volume.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 1024
        hard: 2048

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024M
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 64M

    healthcheck:
      test: ["CMD", "zeroclaw", "status", "--format=exit-code"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
