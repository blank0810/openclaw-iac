services:
  jarvis:
    image: ghcr.io/openclaw/openclaw:2026.4.5
    container_name: openclaw-jarvis
    init: true
    restart: unless-stopped
    command: ["node", "dist/index.js", "gateway", "--bind", "loopback", "--port", "18789"]
    ports:
      - "127.0.0.1:18789:18789"
      - "127.0.0.1:18790:18790"
    volumes:
      - ./openclaw_data:/home/node/.openclaw
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN must be set}
      - NODE_OPTIONS=--max-old-space-size=1536
      - TZ=${TZ:-UTC}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_SERVER_ID=${DISCORD_SERVER_ID:-}
      - DISCORD_OWNER_ID=${DISCORD_OWNER_ID:-}
      - WHATSAPP_OWNER_PHONE=${WHATSAPP_OWNER_PHONE:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SEARXNG_BASE_URL=http://searxng:8080
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    networks:
      - openclaw_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:18789/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  searxng:
    image: searxng/searxng:latest
    container_name: jarvis-searxng
    init: true
    restart: unless-stopped
    volumes:
      - ./searxng_data:/etc/searxng
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-searxng-jarvis-secret-change-me}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=50M
      - /var/cache/searxng:size=50M
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - openclaw_net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  openclaw_net:
    driver: bridge
