# Copy to agents/<slug>/agent.toml and fill in real values.
# This file holds REAL SECRETS (Composio MCP key, Slack tokens). The agents/
# directory is gitignored except for this template. On the deploy host, chmod
# the rendered agents/<slug>/agent.toml to 0600 so other users can't read it.
#
# Fields not listed here inherit from agents/_defaults.toml. Add a key
# locally only when you want to override the default.

[identity]
name = "REPLACE_ME"
display_name = "REPLACE_ME"
enabled = true
state_dir = "REPLACE_ME"

[runtime]
# Leave image empty to use ZEROCLAW_IMAGE from .env
# image = ""
host_port = 0    # 0 = no host port exposed (default)

[llm]
# Inherits provider, model, api_key, timeout_secs from _defaults.toml.
# Override here only if this agent needs a different model or provider.
# model = "claude-sonnet-4-5"

[slack]
# `agents create --slack` flips enabled to true and fills tokens. Set bot_token
# + app_token below or pass --slack-bot-token / --slack-app-token on the CLI.
# Scoping fields (mention_only, thread_replies, etc.) inherit from defaults.
enabled = false

[composio]
# `agents create --composio` flips enabled to true. Inherits mcp_url,
# mcp_transport, mcp_auth_header from defaults — usually all you need is
# mcp_api_key (your per-entity x-consumer-api-key, blank to share Chaos's).
enabled = false

[autonomy]
# Inherits level + auto_approve list from _defaults.toml. Override
# auto_approve here only when this agent needs a custom tool surface.

[exec]
enabled = false

[policy]
# Surfaces in workspace/AGENTS.md managed policy block via cmd_deploy.
require_approval_for = []
denied_domains = []
